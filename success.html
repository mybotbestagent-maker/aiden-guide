<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Aiden Guide</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #13131f;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .emoji { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
  .subtitle { color: #8888aa; font-size: 16px; line-height: 1.6; margin-bottom: 40px; }
  .subtitle strong { color: #a78bfa; }
  .lang-title { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #555577; margin-bottom: 20px; }
  .download-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1e1e30;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 18px 24px;
    margin-bottom: 12px;
    text-decoration: none;
    color: #fff;
    transition: all 0.2s;
    cursor: pointer;
    width: 100%;
  }
  .download-btn:hover {
    background: #2a2a42;
    border-color: #a78bfa;
    transform: translateY(-1px);
  }
  .btn-left { display: flex; align-items: center; gap: 14px; }
  .flag { font-size: 28px; }
  .lang-name { font-size: 18px; font-weight: 600; text-align: left; }
  .lang-sub { font-size: 13px; color: #666688; margin-top: 2px; text-align: left; }
  .dl-badge {
    background: #a78bfa;
    color: #fff;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .footer { margin-top: 32px; font-size: 13px; color: #444466; }
  .footer a { color: #a78bfa; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🎉</div>
  <h1>Payment Successful!</h1>
  <p class="subtitle">Thank you! Choose your preferred language to download <strong>Aiden Guide</strong>.</p>

  <div class="lang-title">Choose Language / Выберите язык / Elige idioma</div>

  <button onclick="forceDownload('aiden-guide-en.pdf', 'Aiden-Guide-EN.pdf')" class="download-btn">
    <div class="btn-left">
      <div class="flag">🇺🇸</div>
      <div>
        <div class="lang-name">English</div>
        <div class="lang-sub">Aiden Guide — English Version</div>
      </div>
    </div>
    <div class="dl-badge">⬇ Download</div>
  </button>

  <button onclick="forceDownload('aiden-guide-ru.pdf', 'Aiden-Guide-RU.pdf')" class="download-btn">
    <div class="btn-left">
      <div class="flag">🇷🇺</div>
      <div>
        <div class="lang-name">Русский</div>
        <div class="lang-sub">Гайд Aiden — Русская версия</div>
      </div>
    </div>
    <div class="dl-badge">⬇ Скачать</div>
  </button>

  <button onclick="forceDownload('aiden-guide-es.pdf', 'Aiden-Guide-ES.pdf')" class="download-btn">
    <div class="btn-left">
      <div class="flag">🇪🇸</div>
      <div>
        <div class="lang-name">Español</div>
        <div class="lang-sub">Guía Aiden — Versión en Español</div>
      </div>
    </div>
    <div class="dl-badge">⬇ Descargar</div>
  </button>

  <div class="footer">
    Questions? <a href="https://t.me/mybotbestagent">@handy_dad</a>
  </div>
</div>

<script>
function forceDownload(filename, saveName) {
  fetch(filename)
    .then(response => response.blob())
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = saveName;
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(url);
      a.remove();
    })
    .catch(() => {
      // Fallback
      const a = document.createElement('a');
      a.href = filename;
      a.download = saveName;
      a.click();
    });
}
</script>
</body>
</html>
